name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        description: Package version to use for NuGet pack

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test

      - name: Pack
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: dotnet pack FastText.NetWrapper --configuration Release ${{ inputs.version && format('-p:PackageVersion={0}', inputs.version) || '' }} -o Artifacts

      - name: Upload NuGet packages
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: Artifacts/*.nupkg
